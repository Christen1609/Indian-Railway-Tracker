name: worker

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    concurrency:
      group: worker
      cancel-in-progress: false
    defaults:
      run:
        working-directory: train-tracker
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RAILRADAR_API_KEY: ${{ secrets.RAILRADAR_API_KEY }}
      WATCH_TRAINS: ${{ vars.WATCH_TRAINS || '12951' }}
      WORKER_MAX_MINUTES: "330"
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$RAILRADAR_API_KEY" ]; then
            echo "worker skipped: secrets not set"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: steps.secrets.outputs.ready == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: train-tracker/package.json

      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: train-tracker/package.json
          cache: pnpm
          cache-dependency-path: train-tracker/pnpm-lock.yaml

      - if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.secrets.outputs.ready == 'true'
        run: pnpm --filter @train-tracker/ingest exec tsc --build

      - if: steps.secrets.outputs.ready == 'true'
        working-directory: train-tracker/apps/ingest
        run: node dist/main.js $WATCH_TRAINS

  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/worker.yml/enable"
          echo "keep-alive: worker.yml enabled"
