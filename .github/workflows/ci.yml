name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: train-tracker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: train-tracker/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: train-tracker/package.json
          cache: pnpm
          cache-dependency-path: train-tracker/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm lint

  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Keep a parser-fix PR to parsers and fixtures
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if ! echo "$LABELS" | grep -q '"parser-fix"'; then
            echo "scope: not a parser-fix PR"
            exit 0
          fi
          outside=""
          for file in $(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename'); do
            case "$file" in
              train-tracker/packages/core/src/sources/* | train-tracker/fixtures/*) ;;
              *) outside="$outside $file" ;;
            esac
          done
          if [ -n "$outside" ]; then
            echo "scope: a parser-fix PR may only change packages/core/src/sources and fixtures. Outside:$outside"
            exit 1
          fi
          echo "scope: parser-fix PR stays inside parsers and fixtures"
