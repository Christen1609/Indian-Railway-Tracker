<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Indian Railway Tracker</title>
    <meta
      name="description"
      content="Tracking trains across the Indian Railway network using data from public APIs. A passion project."
    />
    <style>
      :root {
        color-scheme: dark light;
        --ink: #f4f4f5;
        --muted: #a1a1aa;
        --ground: #0a0a0b;
        --rule: #27272a;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --ink: #18181b;
          --muted: #52525b;
          --ground: #fafafa;
          --rule: #e4e4e7;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: calc(24px + env(safe-area-inset-top, 0px)) 20px
          calc(24px + env(safe-area-inset-bottom, 0px));
        background: var(--ground);
        color: var(--ink);
        font: 400 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 34rem;
      }
      .eyebrow {
        margin: 0 0 1.5rem;
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h1 {
        margin: 0 0 1.25rem;
        font-size: clamp(2rem, 7vw, 3.25rem);
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }
      p {
        margin: 0 0 1rem;
        max-width: 30rem;
      }
      p.lede {
        font-size: clamp(1rem, 2.4vw, 1.125rem);
      }
      p.note {
        color: var(--muted);
      }
      footer {
        margin-top: 2.5rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--rule);
        font-size: 0.875rem;
        color: var(--muted);
      }
      a {
        color: inherit;
        text-decoration-color: var(--rule);
        text-underline-offset: 3px;
      }
      a:hover {
        text-decoration-color: currentColor;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Indian Railway Tracker</p>
      <h1>Under Construction</h1>
      <p class="lede">
        Tracking trains across the Indian Railway network using data from public APIs.
      </p>
      <p class="note">A passion project.</p>
      <footer>
        Unofficial. Not affiliated with Indian Railways.
        <a href="https://github.com/Christen1609/Indian-Railway-Tracker">Source on GitHub</a>.
      </footer>
    </main>
  </body>
</html>
